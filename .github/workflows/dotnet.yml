# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: {}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal --filter category=post-build
    - name: Cache Godot
      id: godot-cache
      uses: actions/cache@v4
      with:
        path: /tmp/godot
        key: godot-4.6.2-stable-mono-linux
    - name: Install Godot
      if: steps.godot-cache.outputs.cache-hit != 'true'
      run: |
        curl -L -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.2-stable/Godot_v4.6.2-stable_mono_linux_x86_64.zip
        mkdir -p /tmp/godot
        unzip /tmp/godot.zip -d /tmp/godot
    - name: Test Godot client
      # gdUnit4Net's test adapter filters traits differently than xUnit's (TestCategory=<value>,
      # not category=<value>), and [RequireGodotRuntime] tests need a real Godot engine (GODOT_BIN) -
      # kept as its own step/filter rather than folded into the xUnit-oriented step above.
      run: dotnet test source/CardGames.Godot/Tests/CardGames.Godot.Tests.csproj --no-build --verbosity normal --filter TestCategory=post-build --settings source/CardGames.Godot/Tests/.runsettings
      env:
        GODOT_BIN: /tmp/godot/Godot_v4.6.2-stable_mono_linux_x86_64/Godot_v4.6.2-stable_mono_linux.x86_64
